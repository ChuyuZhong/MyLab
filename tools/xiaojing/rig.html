<!doctype html>
<meta charset="utf-8" />
<title>小鲸 rig</title>
<script type="module">
  import { RIGS, renderSprite, tailRig } from "./rig.js";
  import { cutPanels, toDataUrl } from "./panels.js";

  const ART = [584, 458]; // the shared canvas: the work card's own frame
  // the two original pictures, placed so their heads line up with the drawn cards
  const ORIGINALS = {
    pout: { src: "/tools/xiaojing/pout.webp", place: [27.4, 12.6, 1.0526], face: [290, 220, 250] },
    rage: { src: "/tools/xiaojing/rage.webp", place: [17.8, -30.3, 0.94], face: [335, 292, 280] },
  };
  // avatar crops (card pixels): centre between the eyes, a little up
  const FACE = { work: [337, 261, 250], smile: [338, 250, 250], sleep: [345, 262, 250], eat: [345, 237, 250], grab: [332, 238, 250] };
  const r2 = (v) => Math.round(v * 100) / 100;
  const boxIn = ([x, y, k], [bx, by, bw, bh]) => [x + bx * k, y + by * k, bw * k, bh * k].map(r2);
  const webp = async (canvas, quality) => toDataUrl(canvas, "image/webp", quality);
  const loadCanvas = async (src) => {
    const img = new Image();
    img.src = src;
    await img.decode();
    const c = new OffscreenCanvas(img.width, img.height);
    c.getContext("2d").drawImage(img, 0, 0);
    return c;
  };

  // Everything the app needs: stills, sprite sheets, effect pieces and the layout that places them.
  window.build = async () => {
    const files = {}, moods = {};
    const sheet = (s, place, name) => {
      files[`${name}.webp`] = s.url;
      return { file: `${name}.webp`, box: boxIn(place, [-s.pad, -s.pad, s.W + 2 * s.pad, s.H + 2 * s.pad]), frames: s.frames, cols: s.cols, rows: s.rows, seconds: s.seconds };
    };
    const panels = await cutPanels();
    for (const [mood, p] of Object.entries(panels)) {
      const place = p.cfg.place, [W, H] = p.size;
      files[`${mood}.webp`] = await webp(p.figure, 0.9);
      const body = sheet(await renderSprite(p.body, RIGS[mood]), place, `${mood}-body`);
      const [tx, ty] = p.tail.box;
      const t = await renderSprite(p.tail.canvas, tailRig(mood, [tx, ty]));
      files[`${mood}-tail.webp`] = t.url;
      const tail = { file: `${mood}-tail.webp`, box: boxIn(place, [tx - t.pad, ty - t.pad, t.W + 2 * t.pad, t.H + 2 * t.pad]), frames: t.frames, cols: t.cols, rows: t.rows, seconds: t.seconds };
      const fx = [];
      for (const [name, e] of Object.entries(p.effects)) {
        files[`${mood}-${name}.webp`] = await webp(e.canvas, 0.92);
        fx.push({ name, file: `${mood}-${name}.webp`, box: boxIn(place, e.box) });
      }
      const [cx, cy, side] = FACE[mood];
      moods[mood] = { still: { file: `${mood}.webp`, box: boxIn(place, [0, 0, W, H]) }, body, tail, fx, face: boxIn(place, [cx, cy, side, 0]).slice(0, 3) };
    }
    moods.work.glow = boxIn(panels.work.cfg.place, [318, 371, 68, 68]);
    for (const [mood, o] of Object.entries(ORIGINALS)) {
      const c = await loadCanvas(o.src);
      files[`${mood}.webp`] = await webp(c, 0.9);
      const body = sheet(await renderSprite(c, RIGS[mood]), o.place, `${mood}-body`);
      const [cx, cy, side] = o.face;
      moods[mood] = { still: { file: `${mood}.webp`, box: boxIn(o.place, [0, 0, c.width, c.height]) }, body, fx: [], face: boxIn(o.place, [cx, cy, side, 0]).slice(0, 3) };
    }
    return { files, layout: { art: ART, moods } };
  };
</script>
